# Fixture workspace. These files have to look like real ROS 2 launch files and a real
# launcher script, which means os.path and open() and a NamedTemporaryFile that outlives its
# block. Rewriting them into pathlib would stop the fixture reproducing the thing under test.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "TID", "RUF"]
